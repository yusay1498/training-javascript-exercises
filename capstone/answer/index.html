<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャップストーン: メンバー一覧アプリ（模範解答）</title>
</head>
<body>
<h1>メンバー一覧（模範解答）</h1>

<div>
    <input type="search" id="search-input" placeholder="名前で絞り込み">
    <label>
        <input type="checkbox" id="passed-only-checkbox">

</div>

<p id="summary"></p>
<div id="loading">読み込み中...</div>
<div id="error" style="display: none; color: red;"></div>
<ul id="member-list"></ul>

<script type="module" src="./main.js"></script>
</body>
</html>
